<VirtualHost *:80>
    DocumentRoot /var/www/web/build

    RewriteEngine On
    RewriteRule ^/api(/.*)?$ /var/www/api/public/index.php [L]

    <Directory /var/www/api/public>
        Require all granted
    </Directory>

    <Directory /var/www/web/build>
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
